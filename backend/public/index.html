<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Musik</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <audio id="audio-player"></audio>

    <div id="header">
        <div class="header-left">
            <button class="nav-item active" data-page="home-page">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
                </svg>
            </button>
            <button class="nav-item" data-page="search-page">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <circle cx="11" cy="11" r="7"/>
                    <path d="M21 21l-4.35-4.35"/>
                </svg>
            </button>
            <button class="nav-item" data-page="playlist-page">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M4 6h16M4 12h10M4 18h16" stroke-linecap="round"/>
                    <path d="M20 15v-4l-3 1.5" stroke-linecap="round"/>
                </svg>
            </button>
            <button class="nav-item now-playing-btn" data-page="player-page">
                <div class="now-playing">
                    <img id="mini-cover" class="now-playing-cover" src="" alt="">
                    <div class="now-playing-info">
                        <span id="mini-title" class="now-playing-title">Nincs lejátszás</span>
                        <span id="mini-artist" class="now-playing-artist">-</span>
                    </div>
                </div>
            </button>
            <div class="nav-indicator"></div>
        </div>

        <div class="header-right">
            <button class="add-playlist-btn" id="add-music-btn" title="Zene hozzáadása">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <path d="M9 18V5l12-2v13M9 9l12-2"/>
                            <circle cx="6" cy="18" r="3"/>
                            <circle cx="18" cy="16" r="3"/>
                        </svg>
                    </button>
     
                <div class="account-dropdown-container">
            <button class="nav-item" id="btn-account" onclick="toggleAccountMenu(event)">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
            </button>

            <!-- Lenyíló menü elrendezés -->
            <div class="account-menu" id="account-menu">
                <div class="account-menu-header">
                    <span id="user-display-name">Vendég</span>
                </div>
                <hr class="menu-divider">
                <button class="account-menu-item" onclick="navigateToAuth()">
                    <span>Login / Register</span>
                </button>
                <button class="account-menu-item logout-btn" onclick="handleLogout()">
                    <span>Logout</span>
                </button>
            </div>
        </div>
        </div>
    </div>

    <div id="main">


        <div id="home-page" class="page active">
            <div class="section">
                <h2 class="section-title">Recents</h2>
                
                <div class="grid-container" id="recents-grid"></div>
            </div>
            <div class="section">
                <h2 class="section-title">Albums for you</h2>
                <div class="grid-container" id="albums-grid"></div>
            </div>
        </div>

        <div id="search-page" class="page">
            <div class="search-bar">
                <input type="text" id="search-input" class="search-input" placeholder="Search...">
                <svg class="search-bar-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <circle cx="11" cy="11" r="7"/>
                    <path d="M21 21l-4.35-4.35"/>
                </svg>
            </div>
            <div class="section">
                <h2 class="section-title">Recents</h2>
                
                <div class="tag-container" id="recent-searches"></div>
            </div>
            <div class="section">
                <h2 class="section-title">Results</h2>
                <div class="song-list" id="search-results"></div>
            </div>
        </div>

        <div id="playlist-page" class="page">
            <div class="playlist-header">
                <h2 class="section-title">Playlists</h2>
                
                <button class="add-playlist-btn" id="create-playlist-btn">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <path d="M12 5v14M5 12h14"/>
                    </svg>
                </button>
            </div>
            <div class="playlist-grid" id="playlists-grid"></div>
        </div>

        <div id="player-page" class="page">
            <div class="player-container">
                <div class="player-left">
                    <img id="player-cover" class="player-main-cover" src="" alt="">
                    <div class="player-meta">
                        <div id="player-title" class="title">Song name</div>
                        <div id="player-artist" class="artist">Artist</div>
                        <div id="player-album" class="album">Album name</div>
                    </div>
                    <div class="player-progress-container">
                        <input type="range" id="progress-bar" min="0" value="0" step="0.1" class="progress-slider">
                        <div class="progress-times">
                            <span id="current-time">00:00</span>
                            <span id="total-duration">00:00</span>
                        </div>
                    </div>
                    <div class="player-controls">
                        <button class="control-btn" id="btn-shuffle" title="Keverés">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
                        </button>
                        <button class="control-btn" id="btn-prev">
                            <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                        </button>
                        <button class="control-btn play-main-btn" id="btn-play">
                            <svg id="play-icon" width="32" height="32" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                        </button>
                        <button class="control-btn" id="btn-next">
                            <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                        </button>
                        <button class="control-btn" id="btn-repeat" title="Ismétlés">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 2l4 4-4 4M3 11v-1a4 4 0 014-4h14M7 22l-4-4 4-4M21 13v1a4 4 0 01-4 4H3"/></svg>
                        </button>
                    </div>
                    <div class="player-actions">
                        <button class="control-btn" id="btn-like" title="Kedvencekhez adás">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l8.72-8.72 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg>
                        </button>
                        <button class="control-btn" id="btn-add-to-playlist" title="Hozzáadás lejátszási listához">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M12 5v14M5 12h14"/>
                            </svg>
                        </button>
                        <div class="volume-container">
                            <button class="control-btn" id="btn-volume-icon" title="Hangerő / Némítás">
                                <svg id="volume-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                                    <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                                </svg>
                            </button>
                            <input type="range" id="volume-bar" min="0" max="1" step="0.01" value="1" class="volume-slider">
                        </div>
                    </div>
                </div>

                <div class="player-right">
                    <div class="queue-header">
                        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>
                        </svg>
                        <span>Song queue</span>
                    </div>
                    <div class="queue-list" id="queue-container"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="playlist-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal-btn" id="close-modal">&times;</span>
            <h3>Új lejátszási lista</h3>
            <input type="text" id="playlist-name-input" placeholder="Lista neve..." maxlength="30">
            <input type="text" id="playlist-cover-input" placeholder="Borítókép URL (opcionális)...">
            <div class="modal-actions">
                <button id="cancel-playlist-btn" class="modal-btn cancel">Mégse</button>
                <button id="save-playlist-btn" class="modal-btn confirm">Létrehozás</button>
            </div>
        </div>
    </div>

    <div id="add-to-playlist-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal-btn" id="close-add-modal">&times;</span>
            <h3>Hozzáadás listához</h3>
            <div id="playlist-select-list" class="playlist-select-list"></div>
        </div>
    </div>

    <div id="add-song-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal-btn" id="close-add-song-modal">&times;</span>
            <h3>Add music</h3>
            
            <div class="input-group">
                <input type="text" id="song-title-input" placeholder="Name...">
            </div>
            
            <div class="input-group">
                <input type="text" id="song-artist-input" placeholder="Artist...">
            </div>

            <div class="input-group">
                <label for="song-file-input">Audio files (MP3, WAV...)</label>
                <input type="file" id="song-file-input" accept="audio/*">
            </div>

            <div class="input-group">
                <label for="song-cover-file-input">Choose cover (PNG, JPG...)</label>
                <input type="file" id="song-cover-file-input" accept="image/*">
            </div>

            <div class="modal-actions">
                <button id="cancel-add-song-btn" class="modal-btn cancel">Back</button>
                <button id="save-song-btn" class="modal-btn confirm">Add</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="script.js"></script>
</body>
</html>
